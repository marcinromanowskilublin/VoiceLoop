<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">VoiceLoop Dynamic Memory Coupling V1 architecture</title>
  <desc id="desc">Canonical SQLite writes episode state and an outbox entry in one transaction. An idempotent indexer projects versioned named vectors to Qdrant with generation, claim token and model fingerprint fences. At query time, a deterministic domain policy routes Windows exact, Windows exploratory, RPG canon and RPG creative queries across FTS and selected vector waves before hydrating only SQL-verified records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <text x="52" y="56" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">Dynamic Memory Coupling: two explicit loops</text>
  <text x="52" y="86" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">1. Transactional write &amp; generation-fenced index outbox.   2. Domain-aware FTS + wave retrieval hydrated from canonical SQL.</text>

  <g filter="url(#shadow)">
    <!-- 1. Canonical SQL + Outbox -->
    <rect x="52" y="122" width="256" height="274" rx="22" fill="#10253a" stroke="#0ea5e9"/>
    <text x="76" y="156" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="1">1. CANONICAL SQL + OUTBOX</text>
    <text x="76" y="188" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">SQLite Transaction</text>
    <g fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">
      <rect x="76" y="206" width="208" height="36" rx="10" fill="#172f49"/><text x="92" y="229">context_episodes + FTS5</text>
      <rect x="76" y="250" width="208" height="36" rx="10" fill="#172f49"/><text x="92" y="273">context_index_state (CAS)</text>
      <rect x="76" y="294" width="208" height="36" rx="10" fill="#172f49"/><text x="92" y="317">context_index_outbox</text>
    </g>
    <text x="76" y="356" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">desired vs applied revision</text>
    <text x="76" y="376" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">tombstone + delete fence</text>

    <!-- 2. Fenced Qdrant Index -->
    <rect x="358" y="122" width="236" height="274" rx="22" fill="#17233b" stroke="#a78bfa"/>
    <text x="382" y="156" fill="#c4b5fd" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="1">2. FENCED VECTOR INDEX</text>
    <text x="382" y="188" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Qdrant 5 Named Axes</text>
    <text x="382" y="216" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="14">semantic · topic · intent</text>
    <text x="382" y="238" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="14">decision · person_context</text>
    <rect x="382" y="256" width="188" height="84" rx="12" fill="#1e2b48"/>
    <text x="396" y="280" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Point Fence Metadata</text>
    <text x="396" y="302" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13">generation + claim_token</text>
    <text x="396" y="322" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="13">model + prefix fingerprint</text>
    <text x="382" y="368" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Stale generations rejected</text>

    <!-- 3. Adaptive Retrieval Policy -->
    <rect x="644" y="122" width="332" height="274" rx="22" fill="#111c2f" stroke="#34d399"/>
    <text x="668" y="156" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="1">3. RETRIEVAL POLICY V1 (PER QUERY)</text>
    <text x="668" y="188" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Domain &amp; Intent Coupled</text>
    <g font-family="Inter,Segoe UI,sans-serif" font-size="13">
      <rect x="668" y="206" width="284" height="36" rx="10" fill="#17243a"/>
      <text x="682" y="229" fill="#7dd3fc" font-weight="700">Windows exact</text>
      <text x="802" y="229" fill="#cbd5e1">exact_only · FTS 0.90 / Vec 0.10</text>

      <rect x="668" y="250" width="284" height="36" rx="10" fill="#17243a"/>
      <text x="682" y="273" fill="#7dd3fc" font-weight="700">Windows explore</text>
      <text x="802" y="273" fill="#cbd5e1">1–2 waves · FTS 0.55 / Vec 0.45</text>

      <rect x="668" y="294" width="284" height="36" rx="10" fill="#17243a"/>
      <text x="682" y="317" fill="#fde68a" font-weight="700">RPG canon</text>
      <text x="802" y="317" fill="#cbd5e1">SQL-first · FTS 0.72 / Vec 0.28</text>

      <rect x="668" y="338" width="284" height="36" rx="10" fill="#17243a"/>
      <text x="682" y="361" fill="#c4b5fd" font-weight="700">RPG creative</text>
      <text x="802" y="361" fill="#cbd5e1">hybrid 5 axes · FTS 0.25 / Vec 0.75</text>
    </g>

    <!-- 4. SQL-Hydrated ContextPack -->
    <rect x="1026" y="122" width="202" height="274" rx="22" fill="url(#pack)" stroke="#67e8f9"/>
    <text x="1048" y="156" fill="#cffafe" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="1">4. VERIFIED OUTPUT</text>
    <text x="1048" y="188" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">ContextPackV1</text>
    <text x="1048" y="218" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">SQL-hydrated content</text>
    <text x="1048" y="242" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">Weighted FTS+Vec RRF</text>
    <text x="1048" y="266" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">Source hash verified</text>
    <text x="1048" y="290" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="14">Live generation match</text>
    <rect x="1048" y="316" width="158" height="54" rx="12" fill="#082f49"/>
    <text x="1127" y="340" text-anchor="middle" fill="#fcd34d" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">serving = false</text>
    <text x="1127" y="358" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="12">no action authority</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M308 259 H348"/>
    <path d="M594 259 H634"/>
    <path d="M976 259 H1016"/>
  </g>

  <rect x="52" y="422" width="1176" height="44" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="640" y="450" text-anchor="middle" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">INVARIANT: Qdrant nominates candidates · SQLite verifies revision, time and provenance · Context never authorizes execution</text>
</svg>
