<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic dual-track arbiter outcomes</title>
  <desc id="desc">The arbiter records agreement when both tracks return the same first canonical episode version, conflict when their result sets are disjoint, and uncertain for missing, partial, timed out, or unbounded results. Every outcome remains measurement only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1280" height="460" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">One comparison, three explicit outcomes</text>
  <text x="52" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">The rule is deterministic and conservative. It never promotes a retrieval path.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="132" width="240" height="100" rx="20" fill="#17233b" stroke="#a78bfa"/>
    <text x="78" y="168" fill="#c4b5fd" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">RRF5 BASELINE</text>
    <text x="78" y="202" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Canonical episode IDs</text>

    <rect x="52" y="258" width="240" height="100" rx="20" fill="#17233b" stroke="#34d399"/>
    <text x="78" y="294" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">2+2+1 CANDIDATE</text>
    <text x="78" y="328" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Canonical episode IDs</text>

    <rect x="362" y="176" width="184" height="138" rx="22" fill="#2a2130" stroke="#fbbf24"/>
    <text x="454" y="218" text-anchor="middle" fill="#fde68a" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">DETERMINISTIC</text>
    <text x="454" y="250" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">Arbiter</text>
    <text x="454" y="280" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="14">IDs + content versions</text>

    <rect x="616" y="120" width="190" height="220" rx="22" fill="#0f2926" stroke="#34d399"/>
    <circle cx="711" cy="164" r="22" fill="#065f46"/>
    <path d="M701 164l7 7 14-17" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="711" y="212" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">AGREEMENT</text>
    <text x="711" y="246" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">same top episode</text>
    <text x="711" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">same canonical version</text>
    <rect x="646" y="296" width="130" height="26" rx="13" fill="#064e3b"/>
    <text x="711" y="314" text-anchor="middle" fill="#d1fae5" font-family="Inter,Segoe UI,sans-serif" font-size="12">record, do not switch</text>

    <rect x="826" y="120" width="190" height="220" rx="22" fill="#311b25" stroke="#fb7185"/>
    <circle cx="921" cy="164" r="22" fill="#881337"/>
    <path d="M912 155l18 18m0-18l-18 18" fill="none" stroke="#fecdd3" stroke-width="4" stroke-linecap="round"/>
    <text x="921" y="212" text-anchor="middle" fill="#fda4af" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">CONFLICT</text>
    <text x="921" y="246" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">non-empty</text>
    <text x="921" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">disjoint result sets</text>
    <rect x="856" y="296" width="130" height="26" rx="13" fill="#881337"/>
    <text x="921" y="314" text-anchor="middle" fill="#ffe4e6" font-family="Inter,Segoe UI,sans-serif" font-size="12">human review</text>

    <rect x="1036" y="120" width="190" height="220" rx="22" fill="#302716" stroke="#fbbf24"/>
    <circle cx="1131" cy="164" r="22" fill="#92400e"/>
    <text x="1131" y="173" text-anchor="middle" fill="#fef3c7" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">?</text>
    <text x="1131" y="212" text-anchor="middle" fill="#fcd34d" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">UNCERTAIN</text>
    <text x="1131" y="246" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">empty | partial</text>
    <text x="1131" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="14">timeout | unbounded</text>
    <rect x="1066" y="296" width="130" height="26" rx="13" fill="#78350f"/>
    <text x="1131" y="314" text-anchor="middle" fill="#fef3c7" font-family="Inter,Segoe UI,sans-serif" font-size="12">stay in shadow</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M292 182H352"/>
    <path d="M292 308H330Q352 308 352 286"/>
    <path d="M546 214C574 214 580 180 606 180"/>
    <path d="M546 245H816"/>
    <path d="M546 276C574 276 580 310 606 310H1026"/>
  </g>

  <rect x="362" y="382" width="864" height="42" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="794" y="409" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">All outcomes become expiring measurement traces - never actions or automatic serving context</text>
</svg>
