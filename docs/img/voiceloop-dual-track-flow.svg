<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">VoiceLoop local context flow with parallel retrieval tracks</title>
  <desc id="desc">Local sources enter a canonical SQL time gate. The same bounded query runs through five-axis RRF and a 2 plus 2 plus 1 cascade. A deterministic arbiter writes an evidence comparison and expiring shadow trace without selecting production context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <text x="52" y="60" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">From local signals to measured evidence</text>
  <text x="52" y="90" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">SQLite owns time and content. Vectors rank candidates. The prototype stays shadow-only.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="132" width="210" height="260" rx="22" fill="#111c2f" stroke="#334155"/>
    <text x="78" y="168" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="1">LOCAL ADAPTERS</text>
    <g fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="17">
      <rect x="78" y="190" width="158" height="38" rx="10" fill="#17243a"/><text x="96" y="215">Documents</text>
      <rect x="78" y="238" width="158" height="38" rx="10" fill="#17243a"/><text x="96" y="263">Meetings</text>
      <rect x="78" y="286" width="158" height="38" rx="10" fill="#17243a"/><text x="96" y="311">Windows + apps</text>
      <rect x="78" y="334" width="74" height="38" rx="10" fill="#17243a"/><text x="96" y="359">Text</text>
      <rect x="162" y="334" width="74" height="38" rx="10" fill="#17243a"/><text x="177" y="359">Voice</text>
    </g>

    <rect x="322" y="182" width="210" height="160" rx="22" fill="#10253a" stroke="#0ea5e9"/>
    <text x="348" y="222" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">CANONICAL TIME</text>
    <text x="348" y="258" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">SQLite + FTS</text>
    <text x="348" y="286" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="15">UTC interval</text>
    <text x="348" y="310" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="15">source + hash + TTL</text>

    <rect x="596" y="132" width="214" height="112" rx="20" fill="#17233b" stroke="#a78bfa"/>
    <text x="622" y="170" fill="#c4b5fd" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">BASELINE</text>
    <text x="622" y="202" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">RRF5</text>
    <text x="692" y="202" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="14">5 axes in parallel</text>

    <rect x="596" y="280" width="214" height="112" rx="20" fill="#17233b" stroke="#34d399"/>
    <text x="622" y="318" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">CANDIDATE</text>
    <text x="622" y="350" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">2 + 2 + 1</text>
    <text x="622" y="374" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="14">bounded cascade</text>

    <rect x="866" y="182" width="176" height="160" rx="22" fill="#2a2130" stroke="#fbbf24"/>
    <text x="892" y="222" fill="#fde68a" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">LOCAL ARBITER</text>
    <text x="892" y="258" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Agreement</text>
    <text x="892" y="284" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Conflict</text>
    <text x="892" y="310" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Uncertain</text>

    <rect x="1092" y="170" width="150" height="184" rx="22" fill="url(#evidence)" stroke="#67e8f9"/>
    <text x="1114" y="210" fill="#cffafe" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">EVIDENCE</text>
    <text x="1114" y="244" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">Comparison</text>
    <text x="1114" y="270" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700">pack</text>
    <text x="1114" y="302" fill="#dbeafe" font-family="Inter,Segoe UI,sans-serif" font-size="14">content-free</text>
    <text x="1114" y="326" fill="#dbeafe" font-family="Inter,Segoe UI,sans-serif" font-size="14">trace with TTL</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M262 262 H312"/>
    <path d="M532 230 C558 230 562 188 586 188"/>
    <path d="M532 294 C558 294 562 336 586 336"/>
    <path d="M810 188 C838 188 838 230 856 230"/>
    <path d="M810 336 C838 336 838 294 856 294"/>
    <path d="M1042 262 H1082"/>
  </g>

  <rect x="322" y="420" width="720" height="44" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="682" y="448" text-anchor="middle" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">SHADOW ONLY | no automatic serving switch | no action authority</text>
</svg>
