<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">VoiceLoop memory and context architecture</title>
  <desc id="desc">SQLite stores canonical records, text and time. Qdrant stores derived semantic indexes for ranking. Planner context, user recall and timeline recall stay separate, and retrieved context cannot create executable intent.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8aa0b8"/>
    </marker>
    <marker id="arrowContext" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .h1{font:800 34px "Segoe UI",Arial,sans-serif;fill:#f6f8fb}
      .sub{font:15px "Segoe UI",Arial,sans-serif;fill:#a9b7c8}
      .section{font:800 12px "Segoe UI",Arial,sans-serif;letter-spacing:1.4px}
      .node{font:700 17px "Segoe UI",Arial,sans-serif;fill:#f3f7fb;text-anchor:middle}
      .small{font:13px "Segoe UI",Arial,sans-serif;fill:#a9b7c8;text-anchor:middle}
      .tiny{font:12px "Segoe UI",Arial,sans-serif;fill:#9fb0c4;text-anchor:middle}
      .source{fill:#121a27;stroke:#506278;stroke-width:1.8}
      .sql{fill:#10251d;stroke:#52d89a;stroke-width:2.2}
      .vector{fill:#1b1730;stroke:#a78bfa;stroke-width:2.2}
      .role{fill:#0f2231;stroke:#7dd3fc;stroke-width:2}
      .warn{fill:#21131a;stroke:#713c46;stroke-width:1.8}
      .flow{fill:none;stroke:#8aa0b8;stroke-width:2.6;marker-end:url(#arrow)}
      .contextFlow{fill:none;stroke:#7dd3fc;stroke-width:2.6;marker-end:url(#arrowContext)}
      .derived{fill:none;stroke:#a78bfa;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#070910"/>
  <circle cx="1120" cy="-80" r="320" fill="#312e81" opacity=".28"/>
  <circle cx="100" cy="40" r="240" fill="#064e3b" opacity=".24"/>
  <text x="48" y="54" class="section" fill="#7dd3fc">LOCAL MEMORY</text>
  <text x="48" y="94" class="h1">SQLite remembers. Qdrant ranks.</text>
  <text x="48" y="121" class="sub">Exact records and time stay canonical; semantic vectors are derived navigation hints.</text>

  <g transform="translate(60 168)">
    <rect width="230" height="86" rx="22" class="source"/>
    <text x="115" y="36" class="node">Local sources</text>
    <text x="115" y="61" class="small">conversation, memory, meetings, docs</text>
  </g>
  <path d="M290 211H348" class="flow"/>

  <g transform="translate(366 142)">
    <rect width="272" height="138" rx="26" class="sql"/>
    <text x="136" y="44" class="node">SQLite</text>
    <text x="136" y="72" class="small">canonical content</text>
    <text x="136" y="95" class="small">timestamps + FTS5</text>
    <text x="136" y="118" class="small">events, episodes, entities</text>
  </g>
  <path d="M638 211H696" class="derived"/>

  <g transform="translate(714 142)">
    <rect width="272" height="138" rx="26" class="vector"/>
    <text x="136" y="44" class="node">Qdrant</text>
    <text x="136" y="72" class="small">derived semantic index</text>
    <text x="136" y="95" class="small">named vectors + RRF</text>
    <text x="136" y="118" class="small">not the source of truth</text>
  </g>

  <rect x="42" y="318" width="1116" height="140" rx="26" fill="#0d1421" stroke="#223047"/>
  <text x="66" y="350" class="section" fill="#7dd3fc">READ PATHS STAY SEPARATE</text>
  <g transform="translate(86 376)">
    <rect width="300" height="58" rx="18" class="role"/>
    <text x="150" y="25" class="node">Planner context</text>
    <text x="150" y="45" class="small">bounded ContextPackV1</text>
  </g>
  <g transform="translate(450 376)">
    <rect width="300" height="58" rx="18" class="role"/>
    <text x="150" y="25" class="node">User recall</text>
    <text x="150" y="45" class="small">Qdrant -> SQLite fallback</text>
  </g>
  <g transform="translate(814 376)">
    <rect width="300" height="58" rx="18" class="role"/>
    <text x="150" y="25" class="node">Time-first recall</text>
    <text x="150" y="45" class="small">SQLite / FTS -> semantic scout</text>
  </g>

  <path d="M502 280V318" class="contextFlow"/>
  <path d="M850 280V318" class="contextFlow"/>

  <g transform="translate(170 488)">
    <rect width="860" height="44" rx="22" class="warn"/>
    <text x="430" y="28" class="node">context != intent</text>
  </g>
  <text x="600" y="548" class="tiny">Retrieved text can inform an answer, but it cannot create actions, lower risk, replace confirmation, or claim success.</text>
</svg>
