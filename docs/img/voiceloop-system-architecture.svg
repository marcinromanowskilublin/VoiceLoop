<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">VoiceLoop system architecture</title>
  <desc id="desc">VoiceLoop request flow. Requests pass deterministic guards and Router V1 first. If needed, bounded context goes to an LLM proposal, then local code validates, confirms and executes through one queue. Shadow features do not control execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#91a69b"/>
    </marker>
    <marker id="arrowLocal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f6b55"/>
    </marker>
    <style>
      .h1{font:800 34px "Segoe UI",Arial,sans-serif;fill:#17231f}
      .sub{font:15px "Segoe UI",Arial,sans-serif;fill:#66756e}
      .band{font:800 12px "Segoe UI",Arial,sans-serif;letter-spacing:1.4px}
      .node{font:700 16px "Segoe UI",Arial,sans-serif;fill:#17231f;text-anchor:middle}
      .small{font:13px "Segoe UI",Arial,sans-serif;fill:#66756e;text-anchor:middle}
      .micro{font:12px "Segoe UI",Arial,sans-serif;fill:#718078;text-anchor:middle}
      .box{rx:18}
      .intake{fill:#ffffff;stroke:#ced8d2;stroke-width:1.8}
      .context{fill:#eef6f1;stroke:#4d876f;stroke-width:2}
      .model{fill:#efedff;stroke:#7268c9;stroke-width:2.2}
      .local{fill:#e7f2ec;stroke:#2f6b55;stroke-width:2.2}
      .confirm{fill:#fff0e3;stroke:#b36d32;stroke-width:2}
      .shadow{fill:#f7f9f6;stroke:#a9b7af;stroke-width:1.5;stroke-dasharray:7 6}
      .flow{fill:none;stroke:#91a69b;stroke-width:2.6;marker-end:url(#arrow)}
      .localFlow{fill:none;stroke:#2f6b55;stroke-width:3;marker-end:url(#arrowLocal)}
      .dash{fill:none;stroke:#91a69b;stroke-width:1.8;stroke-dasharray:7 6}
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#f7f8f3"/>
  <circle cx="1100" cy="-80" r="320" fill="#efedff" opacity=".85"/>
  <circle cx="110" cy="45" r="240" fill="#eef6f1" opacity=".9"/>
  <text x="48" y="54" class="band" fill="#2f6b55">ACTIVE PATH</text>
  <text x="48" y="94" class="h1">Deterministic shell around an LLM proposal</text>
  <text x="48" y="121" class="sub">Router V1 and hard guards run first. The model proposes only when local code asks it to.</text>

  <rect x="42" y="160" width="1116" height="98" rx="24" fill="#ffffff" stroke="#dce4de"/>
  <text x="66" y="190" class="band" fill="#718078">1. INTAKE</text>
  <g transform="translate(82 204)">
    <rect width="170" height="44" rx="14" class="intake"/>
    <text x="85" y="29" class="node">Panel / Voice / API</text>
  </g>
  <path d="M252 226H303" class="flow"/>
  <g transform="translate(320 204)">
    <rect width="176" height="44" rx="14" class="intake"/>
    <text x="88" y="29" class="node">CommandRequest</text>
  </g>
  <path d="M496 226H547" class="flow"/>
  <g transform="translate(564 190)">
    <rect width="202" height="68" rx="17" class="local"/>
    <text x="101" y="29" class="node">Hard guards</text>
    <text x="101" y="51" class="small">STOP, confidence, speaker</text>
  </g>
  <path d="M766 226H817" class="localFlow"/>
  <g transform="translate(834 190)">
    <rect width="190" height="68" rx="17" class="local"/>
    <text x="95" y="29" class="node">Router V1</text>
    <text x="95" y="51" class="small">deterministic first</text>
  </g>

  <rect x="42" y="282" width="1116" height="116" rx="24" fill="#ffffff" stroke="#dce4de"/>
  <text x="66" y="313" class="band" fill="#4d876f">2. CONTEXT AND PROPOSAL</text>
  <g transform="translate(130 330)">
    <rect width="208" height="52" rx="16" class="context"/>
    <text x="104" y="23" class="node">Bounded context</text>
    <text x="104" y="41" class="small">memory, history, optional screen</text>
  </g>
  <path d="M338 356H407" class="flow"/>
  <g transform="translate(424 314)">
    <rect width="242" height="84" rx="19" class="model"/>
    <text x="121" y="35" class="node">LLM boundary</text>
    <text x="121" y="59" class="small">conversation or ProposedPlan</text>
  </g>
  <path d="M666 356H735" class="flow"/>
  <g transform="translate(752 330)">
    <rect width="244" height="52" rx="16" class="local"/>
    <text x="122" y="23" class="node">Local plan binding</text>
    <text x="122" y="41" class="small">known actions only</text>
  </g>

  <rect x="42" y="422" width="1116" height="86" rx="24" fill="#ffffff" stroke="#dce4de"/>
  <text x="66" y="453" class="band" fill="#2f6b55">3. LOCAL AUTHORITY</text>
  <g transform="translate(220 452)">
    <rect width="190" height="44" rx="14" class="local"/>
    <text x="95" y="29" class="node">Policy gates</text>
  </g>
  <path d="M410 474H461" class="localFlow"/>
  <g transform="translate(478 452)">
    <rect width="154" height="44" rx="14" class="confirm"/>
    <text x="77" y="29" class="node">Confirm</text>
  </g>
  <path d="M632 474H683" class="localFlow"/>
  <g transform="translate(700 452)">
    <rect width="170" height="44" rx="14" class="local"/>
    <text x="85" y="29" class="node">Executor queue</text>
  </g>
  <path d="M870 474H921" class="localFlow"/>
  <g transform="translate(938 452)">
    <rect width="128" height="44" rx="14" class="context"/>
    <text x="64" y="29" class="node">ActionResult</text>
  </g>

  <g transform="translate(82 522)">
    <rect width="1036" height="28" rx="14" class="shadow"/>
    <text x="518" y="19" class="micro">Shadow only: Routing V2, commitment analysis and Situation State can observe or report; they do not create executable actions.</text>
  </g>
</svg>
