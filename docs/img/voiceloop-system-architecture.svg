<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VoiceLoop system architecture</title>
  <desc id="desc">Current VoiceLoop control flow. Requests pass deterministic guards, Router V1, optional context assembly and an LLM proposal. Local code binds actions, enforces allowlists and risk, obtains confirmation, and executes through one queue. Routing V2 and commitment analysis remain shadow paths; context cannot create intent.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#71869a"/>
    </marker>
    <marker id="arrowActive" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#51cfa0"/>
    </marker>
    <style>
      .h1{font:700 27px "Segoe UI",Arial,sans-serif;fill:#f3f7fa}
      .sub{font:13px "Segoe UI",Arial,sans-serif;fill:#91a4b6}
      .band{font:700 11px "Segoe UI",Arial,sans-serif;letter-spacing:1.1px}
      .node{font:600 13px "Segoe UI",Arial,sans-serif;fill:#eaf0f5;text-anchor:middle}
      .small{font:11px "Segoe UI",Arial,sans-serif;fill:#91a4b6;text-anchor:middle}
      .tiny{font:10px "Segoe UI",Arial,sans-serif;fill:#708397}
      .footer{font:10px "Segoe UI",Arial,sans-serif;fill:#687b8e}
      .active{fill:#10201c;stroke:#3ba47e;stroke-width:1.5}
      .neutral{fill:#121821;stroke:#435668;stroke-width:1.5}
      .context{fill:#101b25;stroke:#4f86b4;stroke-width:1.5}
      .model{fill:#181529;stroke:#8e7ae3;stroke-width:2}
      .shadow{fill:#201b10;stroke:#c99c43;stroke-width:1.5;stroke-dasharray:7 5}
      .result{fill:#0f1b27;stroke:#5898d2;stroke-width:1.5}
      .flow{fill:none;stroke:#71869a;stroke-width:2;marker-end:url(#arrow)}
      .localFlow{fill:none;stroke:#51cfa0;stroke-width:2.2;marker-end:url(#arrowActive)}
      .contextFlow{fill:none;stroke:#5683a8;stroke-width:1.7;marker-end:url(#arrow)}
      .shadowFlow{fill:none;stroke:#c99c43;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="900" rx="12" fill="#0b0f14"/>
  <text x="40" y="45" class="h1">VoiceLoop system architecture</text>
  <text x="40" y="69" class="sub">Typed proposals inside deterministic local control</text>

  <g transform="translate(978 25)">
    <line x1="0" y1="12" x2="30" y2="12" stroke="#51cfa0" stroke-width="2"/>
    <text x="40" y="16" class="tiny" fill="#8ddfbe">ACTIVE / PRODUCTION</text>
    <line x1="180" y1="12" x2="210" y2="12" stroke="#c99c43" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="220" y="16" class="tiny" fill="#e6bd68">SHADOW / EXPERIMENTAL</text>
    <line x1="0" y1="37" x2="30" y2="37" stroke="#5683a8" stroke-width="2"/>
    <text x="40" y="41" class="tiny" fill="#80aed2">CONTEXT ONLY</text>
  </g>

  <rect x="30" y="92" width="1380" height="112" rx="10" fill="#0e141b" stroke="#263543"/>
  <text x="48" y="116" class="band" fill="#8ddfbe">ACTIVE INTAKE AND DETERMINISTIC CONTROL</text>

  <g transform="translate(50 132)">
    <rect width="150" height="52" rx="7" class="neutral"/>
    <text x="75" y="22" class="node">User / Voice / API</text>
    <text x="75" y="40" class="small">panel · VoiceAttack · HTTP</text>
  </g>
  <path d="M200 158H238" class="flow"/>
  <g transform="translate(245 132)">
    <rect width="132" height="52" rx="7" class="context"/>
    <text x="66" y="22" class="node">Deepgram STT</text>
    <text x="66" y="40" class="small">voice input only</text>
  </g>
  <path d="M377 158H415" class="flow"/>
  <g transform="translate(422 132)">
    <rect width="146" height="52" rx="7" class="neutral"/>
    <text x="73" y="31" class="node">CommandRequest</text>
  </g>
  <path d="M568 158H606" class="flow"/>
  <g transform="translate(613 132)">
    <rect width="174" height="52" rx="7" class="active"/>
    <text x="87" y="22" class="node">Deterministic guards</text>
    <text x="87" y="40" class="small">STOP · confidence · speaker</text>
  </g>
  <path d="M787 158H825" class="localFlow"/>
  <g transform="translate(832 132)">
    <rect width="132" height="52" rx="7" class="active"/>
    <text x="66" y="22" class="node">Router V1</text>
    <text x="66" y="40" class="small">deterministic first</text>
  </g>
  <path d="M964 158H1002" class="shadowFlow"/>
  <g transform="translate(1009 132)">
    <rect width="150" height="52" rx="7" class="shadow"/>
    <text x="75" y="22" class="node">Routing V2</text>
    <text x="75" y="40" class="small">shadow by default</text>
  </g>
  <path d="M1159 158H1197" class="shadowFlow"/>
  <g transform="translate(1204 132)">
    <rect width="174" height="52" rx="7" class="shadow"/>
    <text x="87" y="22" class="node">Commitment Layer</text>
    <text x="87" y="40" class="small">shadow event only</text>
  </g>

  <rect x="30" y="224" width="1380" height="276" rx="10" fill="#0e141b" stroke="#263543"/>
  <text x="48" y="249" class="band" fill="#80aed2">CONTEXT ASSEMBLY AND MODEL PROPOSAL</text>

  <g transform="translate(50 278)">
    <rect width="154" height="46" rx="7" class="context"/>
    <text x="77" y="28" class="node">SQLite</text>
    <rect y="58" width="154" height="46" rx="7" class="context"/>
    <text x="77" y="86" class="node">Qdrant memory</text>
    <rect y="116" width="154" height="46" rx="7" class="context"/>
    <text x="77" y="144" class="node">Screenpipe</text>
    <rect y="174" width="154" height="46" rx="7" class="context"/>
    <text x="77" y="194" class="node">Context Timeline</text>
    <text x="77" y="211" class="small">recall off by default</text>
  </g>
  <path d="M204 301H292" class="contextFlow"/>
  <path d="M204 359H292" class="contextFlow"/>
  <path d="M204 417H292" class="contextFlow"/>
  <path d="M204 475H292" class="contextFlow"/>

  <g transform="translate(300 330)">
    <rect width="190" height="94" rx="9" class="context"/>
    <text x="95" y="31" class="node">ContextAssembler</text>
    <text x="95" y="51" class="small">budget · dedupe · provenance</text>
    <text x="95" y="72" class="node" fill="#8dc8ff">ContextPackV1</text>
  </g>
  <path d="M490 377H548" class="contextFlow"/>

  <g transform="translate(556 286)">
    <rect width="250" height="182" rx="11" class="model"/>
    <text x="16" y="23" class="band" fill="#b9a7ff">LLM BOUNDARY</text>
    <rect x="22" y="44" width="206" height="70" rx="8" fill="#201a38" stroke="#6f5fc3"/>
    <text x="125" y="71" class="node">LLM planner</text>
    <text x="125" y="92" class="small">conversation or ProposedPlan</text>
    <text x="125" y="143" class="node" fill="#c6b8ff">LLM PROPOSES</text>
    <text x="125" y="164" class="small">No direct execution authority</text>
  </g>

  <path d="M898 184V276H826" class="localFlow"/>
  <g transform="translate(830 286)">
    <rect width="186" height="70" rx="8" class="active"/>
    <text x="93" y="27" class="node">Deterministic</text>
    <text x="93" y="47" class="node">CommandPlan</text>
  </g>
  <path d="M806 377H1052" class="flow"/>
  <path d="M1016 321H1052" class="localFlow"/>

  <g transform="translate(1060 330)">
    <rect width="176" height="94" rx="9" class="active"/>
    <text x="88" y="31" class="node">Local binding</text>
    <text x="88" y="51" class="small">known actions · target identity</text>
    <text x="88" y="73" class="node" fill="#8ddfbe">CommandPlan</text>
  </g>

  <g transform="translate(1260 286)">
    <rect width="118" height="70" rx="8" class="context"/>
    <text x="59" y="26" class="node">Situation State</text>
    <text x="59" y="46" class="small">read-only API</text>
    <text x="59" y="61" class="small">no control path</text>
  </g>

  <rect x="30" y="520" width="1380" height="242" rx="10" fill="#0e141b" stroke="#263543"/>
  <text x="48" y="545" class="band" fill="#8ddfbe">LOCAL AUTHORITY BOUNDARY</text>
  <text x="1230" y="545" class="band" fill="#8ddfbe">LOCAL CODE DECIDES</text>

  <g transform="translate(74 595)">
    <rect width="184" height="72" rx="8" class="active"/>
    <text x="92" y="28" class="node">ActionRegistry</text>
    <text x="92" y="49" class="small">registered allowlist</text>
  </g>
  <path d="M258 631H306" class="localFlow"/>
  <g transform="translate(314 595)">
    <rect width="184" height="72" rx="8" class="active"/>
    <text x="92" y="28" class="node">Argument validation</text>
    <text x="92" y="49" class="small">strict per-action schema</text>
  </g>
  <path d="M498 631H546" class="localFlow"/>
  <g transform="translate(554 595)">
    <rect width="184" height="72" rx="8" class="active"/>
    <text x="92" y="28" class="node">Local risk policy</text>
    <text x="92" y="49" class="small">model cannot lower risk</text>
  </g>
  <path d="M738 631H786" class="localFlow"/>
  <g transform="translate(794 595)">
    <rect width="184" height="72" rx="8" fill="#241e11" stroke="#c99c43" stroke-width="1.5"/>
    <text x="92" y="28" class="node">Confirmation gate</text>
    <text x="92" y="49" class="small">when locally required</text>
  </g>
  <path d="M978 631H1026" class="localFlow"/>
  <g transform="translate(1034 581)">
    <rect width="184" height="100" rx="9" class="active"/>
    <text x="92" y="28" class="node">CommandExecutor</text>
    <text x="92" y="49" class="small">single queue · one active plan</text>
    <text x="92" y="72" class="small">ActionSpec handler</text>
  </g>
  <path d="M1218 631H1266" class="localFlow"/>
  <g transform="translate(1274 595)">
    <rect width="104" height="72" rx="8" class="result"/>
    <text x="52" y="28" class="node">ActionResult</text>
    <text x="52" y="49" class="small">success lives here</text>
  </g>

  <path d="M1148 424V570H166V587" class="localFlow"/>

  <rect x="30" y="782" width="1380" height="72" rx="9" fill="#111820" stroke="#2c3c4a"/>
  <text x="52" y="809" class="band" fill="#f08b96">PROHIBITED DIRECT PATHS</text>
  <text x="52" y="833" class="sub">LLM  -X’  shell   ·   Windows   ·   filesystem   ·   CommandExecutor</text>
  <text x="1390" y="809" class="band" fill="#8ddfbe" text-anchor="end">MODEL PROPOSES · LOCAL CODE DECIDES</text>

  <text x="40" y="882" class="footer">VoiceLoop 0.3.0 · Architecture rev 0.030 · 2026-09-20</text>
  <text x="1400" y="882" class="footer" text-anchor="end">Source of truth: listener/voiceloop + architecture invariants</text>
</svg>
