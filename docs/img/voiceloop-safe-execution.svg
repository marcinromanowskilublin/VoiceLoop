<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VoiceLoop safe execution model</title>
  <desc id="desc">The model can propose a plan, but only local code can validate, ask for confirmation and execute it. Success is reported only by ActionResult.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8aa0b8"/>
    </marker>
    <style>
      .title{font:800 34px "Segoe UI",Arial,sans-serif;fill:#f6f8fb}
      .sub{font:15px "Segoe UI",Arial,sans-serif;fill:#a9b7c8}
      .eyebrow{font:800 12px "Segoe UI",Arial,sans-serif;letter-spacing:1.4px;fill:#74f0b6}
      .label{font:700 17px "Segoe UI",Arial,sans-serif;fill:#f3f7fb;text-anchor:middle}
      .small{font:13px "Segoe UI",Arial,sans-serif;fill:#a9b7c8;text-anchor:middle}
      .note{font:700 14px "Segoe UI",Arial,sans-serif;fill:#ffd6dd;text-anchor:middle}
      .line{fill:none;stroke:#8aa0b8;stroke-width:2.8;marker-end:url(#arrow)}
      .request{fill:#121a27;stroke:#506278;stroke-width:1.8}
      .model{fill:#1b1730;stroke:#a78bfa;stroke-width:2.2}
      .local{fill:#10251d;stroke:#52d89a;stroke-width:2.2}
      .confirm{fill:#261f10;stroke:#f8d36b;stroke-width:2.2}
      .result{fill:#0f2231;stroke:#7dd3fc;stroke-width:2.2}
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#070910"/>
  <circle cx="1040" cy="-40" r="260" fill="#1a365d" opacity=".38"/>
  <circle cx="120" cy="20" r="240" fill="#14532d" opacity=".22"/>
  <text x="48" y="55" class="eyebrow">LOCAL AUTHORITY BOUNDARY</text>
  <text x="48" y="96" class="title">The model proposes. Local code decides.</text>
  <text x="48" y="123" class="sub">A plan is only a suggestion until local validation, policy and the executor accept it.</text>

  <g transform="translate(60 190)">
    <rect width="150" height="94" rx="18" class="request"/>
    <text x="75" y="42" class="label">Request</text>
    <text x="75" y="65" class="small">voice / text / API</text>
  </g>
  <path d="M210 237H265" class="line"/>

  <g transform="translate(282 166)">
    <rect width="190" height="142" rx="22" class="model"/>
    <text x="95" y="54" class="label">ProposedPlan</text>
    <text x="95" y="80" class="small">LLM output</text>
    <text x="95" y="107" class="small">no direct authority</text>
  </g>
  <path d="M472 237H527" class="line"/>

  <g transform="translate(544 166)">
    <rect width="196" height="142" rx="22" class="local"/>
    <text x="98" y="48" class="label">Local gates</text>
    <text x="98" y="74" class="small">known action IDs</text>
    <text x="98" y="96" class="small">schemas + risk policy</text>
  </g>
  <path d="M740 237H795" class="line"/>

  <g transform="translate(812 166)">
    <rect width="160" height="142" rx="22" class="confirm"/>
    <text x="80" y="55" class="label">Confirm</text>
    <text x="80" y="81" class="small">only when</text>
    <text x="80" y="103" class="small">locally required</text>
  </g>
  <path d="M972 237H1027" class="line"/>

  <g transform="translate(1044 166)">
    <rect width="112" height="142" rx="22" class="result"/>
    <text x="56" y="48" class="label">Run</text>
    <text x="56" y="74" class="small">single</text>
    <text x="56" y="95" class="small">queue</text>
    <text x="56" y="122" class="small">ActionResult</text>
  </g>

  <rect x="282" y="336" width="674" height="42" rx="21" fill="#21131a" stroke="#713c46"/>
  <text x="619" y="362" class="note">No direct model path to shell, arbitrary OS control, filesystem, or executor.</text>
</svg>
