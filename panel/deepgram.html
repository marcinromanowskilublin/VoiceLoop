<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceLoop — Deepgram live</title>
<style>
  :root { --bg:#0f1115; --card:#181c24; --line:#2a3040; --txt:#e8eaf0; --dim:#8b93a7; --acc:#4f8cff; --ok:#3ddc84; --err:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h1 small { color:var(--dim); font-weight:400; font-size:14px; margin-left:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; width:100%; max-width:640px; margin-top:18px; }
  label { display:block; font-size:12px; color:var(--dim); margin:10px 0 4px; }
  input, select { width:100%; background:#10141c; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:14px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { margin-top:16px; width:100%; padding:14px; font-size:16px; font-weight:600; border:none; border-radius:10px; cursor:pointer; background:var(--acc); color:#fff; transition:background .15s; }
  button.rec { background:var(--err); }
  #status { margin-top:10px; font-size:13px; color:var(--dim); text-align:center; }
  #status.on { color:var(--ok); }
  #status.err { color:var(--err); }
  #interim { min-height:28px; margin-top:14px; font-size:17px; color:var(--acc); font-style:italic; text-align:center; }
  ul { list-style:none; padding:0; margin:10px 0 0; width:100%; max-width:640px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:8px; font-size:15px; display:flex; justify-content:space-between; gap:10px; }
  li span.t { color:var(--dim); font-size:12px; white-space:nowrap; }
  .hint { color:var(--dim); font-size:12px; margin-top:14px; text-align:center; max-width:640px; }
</style>
</head>
<body>
  <h1>VoiceLoop <small>Deepgram live &rarr; n8n &rarr; akcja</small></h1>

  <div class="card">
    <label>Klucz API Deepgram</label>
    <input id="key" type="password" autocomplete="off">
    <div class="row">
      <div>
        <label>Model</label>
        <select id="model">
          <option value="nova-3">nova-3</option>
          <option value="nova-2">nova-2 (fallback dla PL)</option>
        </select>
      </div>
      <div>
        <label>Język</label>
        <input id="lang" value="pl">
      </div>
    </div>
    <button id="btn">&#127908; Start</button>
    <div id="status">gotowy</div>
    <div id="interim"></div>
  </div>

  <ul id="log"></ul>
  <div class="hint">Mów naturalnie, np. &bdquo;otwórz kalendarz&rdquo;, &bdquo;otwórz przeglądarkę&rdquo;, &bdquo;notatka&rdquo;, &bdquo;stop&rdquo;.
  Po pauzie w mówieniu zdanie leci do n8n (webhook <code>/webhook/voice?text=...</code>), a n8n decyduje, co zrobić.</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ws = null, rec = null, stream = null, finals = [], running = false;

  $('key').value = '';
  $('model').value = localStorage.getItem('vl_model') || 'nova-3';
  $('lang').value = localStorage.getItem('vl_lang') || 'pl';

  function setStatus(txt, cls) { var s = $('status'); s.textContent = txt; s.className = cls || ''; }
  function showInterim(t) { $('interim').textContent = t; }

  function addLog(text) {
    var li = document.createElement('li');
    li.innerHTML = '<span>' + text.replace(/</g, '&lt;') + '</span><span class="t">' + new Date().toLocaleTimeString() + '</span>';
    $('log').insertBefore(li, $('log').firstChild);
    return li;
  }

  function flush() {
    var text = finals.join(' ').trim();
    finals = [];
    showInterim('');
    if (!text) return;
    var li = addLog(text);
    fetch('/webhook/voice?text=' + encodeURIComponent(text))
      .then(function (r) { if (!r.ok) throw 0; li.style.borderColor = '#3ddc84'; })
      .catch(function () { li.style.borderColor = '#ff5d5d'; setStatus('blad wysylki do n8n - czy workflow Voice Loop jest aktywny?', 'err'); });
  }

  function start() {
    var key = $('key').value.trim();
    if (!key) { setStatus('podaj klucz API', 'err'); return; }
    localStorage.setItem('vl_model', $('model').value);
    localStorage.setItem('vl_lang', $('lang').value.trim());

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      var params = new URLSearchParams({
        model: $('model').value,
        language: $('lang').value.trim(),
        smart_format: 'true',
        interim_results: 'true',
        endpointing: '300',
        utterance_end_ms: '1200',
        punctuate: 'true'
      });
      ws = new WebSocket('wss://api.deepgram.com/v1/listen?' + params.toString(), ['token', key]);

      ws.onopen = function () {
        rec = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        rec.ondataavailable = function (e) { if (e.data.size > 0 && ws && ws.readyState === 1) ws.send(e.data); };
        rec.start(250);
        running = true;
        $('btn').textContent = '\u23F9 Stop';
        $('btn').className = 'rec';
        setStatus('slucham...', 'on');
      };

      ws.onmessage = function (ev) {
        var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
        if (d.type === 'Results') {
          var alt = d.channel && d.channel.alternatives && d.channel.alternatives[0];
          var t = (alt && alt.transcript) || '';
          if (d.is_final) {
            if (t) finals.push(t);
            showInterim(finals.join(' '));
            if (d.speech_final) flush();
          } else {
            showInterim(finals.concat(t ? [t] : []).join(' '));
          }
        } else if (d.type === 'UtteranceEnd') {
          flush();
        }
      };

      ws.onerror = function () { setStatus('blad polaczenia z Deepgram (klucz? internet?)', 'err'); };
      ws.onclose = function (e) { if (running) setStatus('rozlaczono (' + e.code + ')', 'err'); stopAll(false); };
    }).catch(function () {
      setStatus('brak dostepu do mikrofonu - kliknij klodke przy adresie i zezwol', 'err');
    });
  }

  function stopAll(closeWs) {
    running = false;
    if (rec && rec.state !== 'inactive') rec.stop();
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (closeWs !== false && ws && ws.readyState === 1) ws.close();
    rec = null; stream = null; ws = null;
    $('btn').textContent = '\uD83C\uDFA4 Start';
    $('btn').className = '';
    if (!$('status').className) setStatus('gotowy');
  }

  $('btn').onclick = function () { running ? (setStatus('zatrzymano'), stopAll()) : start(); };
})();
</script>
</body>
</html>
