[project]
name = "voiceloop"
version = "0.2.0"
description = "Local-first Windows voice assistant core"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["voiceloop"]
