[project]
name = "voiceloop"
version = "0.3.0"
description = "Local-first Windows context workspace core"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Bez tego ruff bierze `voiceloop` i `vectorscope` za paczki zewnętrzne i zgłasza
# I001 w plikach, których nikt nie ruszał — zależnie od katalogu uruchomienia.
[tool.ruff.lint.isort]
known-first-party = ["voiceloop", "vectorscope"]
